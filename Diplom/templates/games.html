<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Все игры</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a href="/logout" class="btn btn-red logout-btn">Выйти</a>

    <div class="page-wrapper">
        <a href="/categories" class="back-link">← Назад к разделам</a>
        <h1>Все игры</h1>

        {% for game in games %}
        <div class="card">
            <a href="/game/{{ game.id }}"
               style="font-weight:700;font-size:15px;">{{ game.name }}</a>
        </div>
        {% endfor %}

        {% if not games %}
            <p style="color:var(--text-muted);">Игр пока нет.</p>
        {% endif %}
    </div>
</body>
</html>
